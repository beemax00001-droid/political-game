<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f7">
  <title>آجیییی 🎀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain"></div>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="float-layer" aria-hidden="true">
    <span class="float f1">✦</span><span class="float f2">♡</span><span class="float f3">✿</span>
    <span class="float f4">✧</span><span class="float f5">♥</span><span class="float f6">⋆</span>
  </div>
  <main class="app-shell">
    <header class="topbar" aria-hidden="true"></header>
    <section class="screen active" id="welcome">
      <div class="hero-sticker" aria-hidden="true">
        <span class="orbit orbit-a">✦</span><span class="orbit orbit-b">♡</span>
        <div class="sticker-face">૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</div>
        <span class="mini-spark s-a">✧</span><span class="mini-spark s-b">✿</span>
      </div>
      <h1 class="main-title">
        <span>آجیییی</span>
        <span>آجیییییی</span>
        <span>آجیییییییی</span>
        <span>میخوای حرف بزنیم؟</span>
      </h1>
      <div class="choice-stage" id="choiceStage">
        <button class="choice yes-choice" id="yesBtn" type="button">
          <span class="btn-icon">♡</span><span>آره</span><span class="btn-arrow">↗</span>
        </button>
        <button class="choice no-choice" id="noBtn" type="button">
          <span class="btn-icon">☁</span><span>نه</span>
        </button>
      </div>
      <div class="counter" id="counter" aria-hidden="true"></div>
    </section>

    <section class="screen" id="schedule">
      <button class="back-link" id="backBtn" type="button">→</button>
      <div class="schedule-art">🕰️<span>✦</span></div>
      <div class="schedule-grid">
        <button class="time-card" data-time="فردا ظهر"><span class="time-emoji">☀️</span><strong>فردا ظهر</strong><i>↗</i></button>
        <button class="time-card" data-time="فردا شب"><span class="time-emoji">🌙</span><strong>فردا شب</strong><i>↗</i></button>
      </div>
    </section>

    <section class="screen" id="done">
      <div class="confetti-zone" aria-hidden="true"></div>
      <div class="done-burst">✦ ✧ ♡ ✧ ✦</div>
      <div class="cat-frame"><img src="assets/cat-sticker.jpg" alt="استیکر گربه"></div>
      <div class="cat-speech">منمووووننننن!</div>
      <button class="telegram-btn" id="telegramBtn" type="button"><span>↗</span> ارسال نتیجه به تلگرام</button>
    </section>

    <section class="screen" id="thanks">
      <div class="thanks-icon">♡</div>
      <h2>ممنون که صادقانه جواب دادی</h2>
      <p class="thanks-copy">و با عدالت طاهایی راه اومدی 🎀</p>
      <div class="thanks-decoration">✿　✧　♡　✧　✿</div>
      <button class="telegram-btn" id="noTelegramBtn" type="button"><span>↗</span> ارسال نتیجه به تلگرام</button>
    </section>
    <footer aria-hidden="true"></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>

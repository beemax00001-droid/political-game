<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Security System</title>
<style>
*{box-sizing:border-box}
:root{--green:#00ff66;--red:#ff3030;--dim:#0b6f36}
body{margin:0;background:#020302;color:var(--green);font-family:monospace;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,102,.025) 0 1px,transparent 1px 4px);z-index:20}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.72));z-index:19}
#screen{position:fixed;inset:0;background:#020302;padding:54px 18px 24px}
#tabs{position:fixed;top:0;left:0;right:0;display:flex;gap:3px;overflow:hidden;padding:4px;background:#050805;border-bottom:1px solid #174d2d;z-index:5}
.tab{background:#0a100c;color:#8ed9aa;border:1px solid #183b25;padding:7px 12px;min-width:112px;font-size:10px;box-shadow:inset 0 -2px #061208}
#top{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--green);padding-bottom:10px;font-size:13px;text-shadow:0 0 7px var(--green)}
#status.warning{color:var(--red);text-shadow:0 0 10px var(--red)}
#terminal{margin-top:15px;height:62vh;overflow:hidden;font-size:13px;line-height:1.8;direction:ltr;text-align:left}
.line{animation:appear .12s}
.dim{color:#47a86b}.warning{color:var(--red);font-weight:bold;text-shadow:0 0 8px var(--red)}
.critical{font-size:17px;animation:glitch .16s infinite}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes glitch{0%,100%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,0)}}
#meter{position:fixed;left:18px;right:18px;bottom:60px;height:6px;border:1px solid #174d2d;background:#031006}
#fill{height:100%;width:0;background:var(--green);box-shadow:0 0 12px var(--green);transition:width .3s}
#timer{position:fixed;bottom:18px;left:18px;border:1px solid var(--green);padding:7px 13px;background:#000;font-size:12px}
#ip{position:fixed;bottom:18px;right:18px;color:#57966e;font-size:10px}
#end{display:none;position:fixed;inset:0;background:#020302;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:30}
#end div{max-width:620px}
#end .warning{font-size:24px}
#cursor{display:inline-block;width:8px;height:15px;background:var(--green);animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="screen">
  <div id="tabs"></div>
  <div id="top">
    <span>SECURITY SYSTEM // LIVE MONITOR</span>
    <span id="status">INITIALIZING...</span>
  </div>
  <div id="terminal"></div>
  <div id="meter"><div id="fill"></div></div>
  <div id="timer">03:00</div>
  <div id="ip">SESSION: UNKNOWN // NODE: ACTIVE</div>
</div>

<div id="end">
  <div>
    <div class="warning">⚠ هشدار امنیتی</div><br>
    <div>این صفحه یک شبیه‌ساز نمایشی است و به اطلاعات واقعی دستگاه، مرورگر یا تاریخچه جست‌وجوی شما دسترسی ندارد.</div>
    <br>
    <div style="color:#00ff66">SECURITY DEMONSTRATION COMPLETE</div>
  </div>
</div>

<script>
const terminal=document.getElementById("terminal");
const tabs=document.getElementById("tabs");
const timer=document.getElementById("timer");
const status=document.getElementById("status");
const fill=document.getElementById("fill");

let seconds=180,index=0;

const messages=[
"Initializing security protocol...",
"Scanning browser environment... [SIMULATION]",
"Checking active sessions... [SIMULATION]",
"Analyzing network requests... [SIMULATION]",
"Searching temporary browser data... [SIMULATION]",
"Checking opened links... [SIMULATION]",
"Loading security modules...",
"Establishing secure connection...",
"Monitoring browser activity... [SIMULATION]",
"Running system diagnostics...",
"Analyzing search history... [SIMULATION]",
"Checking external connections... [SIMULATION]",
"Security scan in progress...",
"WARNING: unusual activity detected...",
"Processing security response...",
"Encrypting local session...",
"Tracing unknown process... [SIMULATION]",
"ACCESS ANOMALY // NODE-07",
"Attempting containment...",
"Containment response delayed..."
];

function addLine(text,cls=""){
  const line=document.createElement("div");
  line.className="line "+cls;
  line.textContent="> "+text;
  terminal.appendChild(line);
  while(terminal.children.length>19) terminal.removeChild(terminal.firstChild);
}

function vibration(){
  if(navigator.vibrate) navigator.vibrate([90,45,90]);
}

function createTab(){
  const tab=document.createElement("div");
  tab.className="tab";
  tab.textContent="NODE-"+String(tabs.children.length+1).padStart(2,"0")+" // SECURE";
  tabs.appendChild(tab);
  if(tabs.children.length>10) tabs.removeChild(tabs.firstChild);
}

function randomHex(n=8){
  const chars="0123456789ABCDEF";
  let x="";
  for(let i=0;i<n;i++) x+=chars[Math.floor(Math.random()*chars.length)];
  return x;
}

const activity=setInterval(()=>{
  addLine(messages[index % messages.length], index%7===6 ? "dim" : "");
  createTab();
  fill.style.width=Math.min(99,((index+1)/20)*100)+"%";

  if(index%3===0) vibration();

  if(index===12){
    addLine("CRITICAL WARNING: suspicious activity detected!","warning critical");
    status.textContent="WARNING";
    status.className="warning";
    vibration();
  }

  if(index===16){
    addLine("SESSION TOKEN: "+randomHex(12)+" // ROTATING","dim");
  }

  if(index===18){
    addLine("!!! SECURITY LOCKDOWN INITIATED !!!","warning critical");
    vibration();
  }

  index++;
},600);

const countdown=setInterval(()=>{
  seconds--;
  const m=Math.floor(seconds/60),s=seconds%60;
  timer.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

  if(seconds<=0){
    clearInterval(countdown);
    clearInterval(activity);
    document.getElementById("screen").style.display="none";
    document.getElementById("end").style.display="flex";
    vibration();
  }
},1000);

window.addEventListener("load",()=>{
  addLine("Secure environment started.");
  addLine("WARNING: DISPLAY MODE / NO REAL SYSTEM ACCESS","warning");
  addLine("Please wait...");
  vibration();
});
</script>
</body>
</html>

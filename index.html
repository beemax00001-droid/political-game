<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمهوری مسخره‌ها</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- صفحه اصلی -->
    <main id="homeScreen" class="screen">

        <h1>🏛️ جمهوری مسخره‌ها</h1>
        <p>یک کشور بساز. تصمیم بگیر. زنده بمان.</p>

        <button onclick="showCreateRoom()">
            ➕ ساخت اتاق
        </button>

        <button onclick="showJoinRoom()">
            🚪 ورود به اتاق
        </button>

    </main>


    <!-- ساخت اتاق -->
    <section id="createScreen" class="screen hidden">

        <h2>🏠 ساخت اتاق</h2>

        <div class="room-code">
            <span>کد اتاق</span>
            <strong id="roomCodeDisplay">------</strong>
        </div>

        <p id="hostStatus">
            در حال ساخت اتاق...
        </p>

        <button onclick="copyRoomCode()">
            📋 کپی کد
        </button>

        <button onclick="backHome()">
            برگشت
        </button>

    </section>


    <!-- ورود به اتاق -->
    <section id="joinScreen" class="screen hidden">

        <h2>🚪 ورود به اتاق</h2>

        <input
            id="roomCodeInput"
            type="text"
            maxlength="6"
            placeholder="کد ۶ رقمی اتاق"
        >

        <button onclick="joinRoom()">
            ورود
        </button>

        <p id="joinStatus"></p>

        <button onclick="backHome()">
            برگشت
        </button>

    </section>


    <!-- اتاق انتظار -->
    <section id="lobbyScreen" class="screen hidden">

        <h2>🎮 اتاق بازی</h2>

        <div class="room-code">
            کد اتاق:
            <strong id="lobbyRoomCode">------</strong>
        </div>

        <div class="players">

            <div id="player1">
                🟢 بازیکن ۱
            </div>

            <div id="player2">
                ⚪ منتظر بازیکن دوم...
            </div>

        </div>

        <p id="lobbyStatus">
            منتظر بازیکن دوم...
        </p>

    </section>


    <!-- خود بازی -->
    <section id="gameScreen" class="screen hidden">

        <h2>🏛️ جمهوری مسخره‌ها</h2>

        <div id="gameContent">
            بازی شروع شد...
        </div>

    </section>


    <!-- ترتیب لود مهم است -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="game.js"></script>

</body>
</html>

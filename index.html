<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>جمهوری مسخره‌ها</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="app">

        <section class="hero">
            <div class="badge">🎭 بازی سیاسی دو نفره</div>

            <h1>جمهوری<br><span>مسخره‌ها</span></h1>

            <p>
                سیاست را جدی نگیر؛
                اینجا هر تصمیمی می‌تواند همه‌چیز را به هم بریزد!
            </p>
        </section>

        <section class="menu">

            <button class="main-btn create" onclick="createRoom()">
                <span>🏛️</span>
                <div>
                    <strong>ساخت اتاق</strong>
                    <small>بازی جدید را شروع کن</small>
                </div>
            </button>

            <button class="main-btn join" onclick="showJoin()">
                <span>🚪</span>
                <div>
                    <strong>ورود به اتاق</strong>
                    <small>با کد دوستت وارد شو</small>
                </div>
            </button>

        </section>

        <section id="joinBox" class="join-box hidden">

            <h2>ورود به اتاق</h2>

            <input
                id="roomCode"
                type="text"
                maxlength="6"
                placeholder="مثلاً A7K92P"
                autocomplete="off"
            >

            <button onclick="joinRoom()">
                ورود به بازی
            </button>

            <button class="back" onclick="hideJoin()">
                برگشت
            </button>

        </section>

        <section id="roomBox" class="room-box hidden">

            <div class="room-icon">🏛️</div>

            <h2>اتاق ساخته شد!</h2>

            <p>این کد را برای بازیکن دوم بفرست:</p>

            <div id="generatedCode" class="room-code">
                ------
            </div>

            <button onclick="copyCode()">
                📋 کپی کردن کد
            </button>

            <div class="waiting">
                <span></span>
                منتظر بازیکن دوم...
            </div>

        </section>

        <footer>
            نسخه آزمایشی 0.1
        </footer>

    </main>

    <script src="game.js"></script>

</body>
</html>
